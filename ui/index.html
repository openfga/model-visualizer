<html>
    <head><title>OpenFGA Model Visualizer</title></head>
    <script src="https://github.com/mdaines/viz-js/releases/download/release-viz-3.12.0/viz-standalone.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.23.1/ace.js"></script>

    <style>
        html, body{
            margin: 0;
            height: 100%;
        }
        div#layout{
            display: flex;
            height: 100vh;
            align-items: stretch;
        }
        div#sidebar{
            display: flex;
            flex-direction: column;
            width: 420px;
            flex-shrink: 0;
            padding: 10px;
            box-sizing: border-box;
            overflow: auto;
        }
        div#sidebar.collapsed{
            display: none;
        }
        div#sidebar.collapsed + div#resizer{
            display: none;
        }
        div#resizer{
            flex: 0 0 auto;
            width: 6px;
            cursor: col-resize;
            background: #ccc;
        }
        div#resizer:hover{
            background: #999;
        }
        button#toggle-sidebar{
            position: absolute;
            top: 8px;
            left: 8px;
            z-index: 10;
            width: auto;
            padding: 2px 8px;
        }
        div#input{
            flex: 1 1 auto;
            min-height: 200px;
            width: 100%;
        }
        div#controls{
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin: 8px 0;
        }
        div.control{
            white-space: nowrap;
        }
        button{
            width: 100%;
            display: block;
            cursor: pointer;
        }
        div#main{
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        div#error{
            color:red;
            font-weight: bold;
            padding: 10px;
        }
        div#error:empty{
            display: none;
        }
        div#error>svg{
            display: block;
            margin: 0 auto;
        }
        div#viz{
            flex: 1 1 auto;
            overflow: auto;
            padding: 20px;
        }
    </style>
    <body>
        <div id="layout">
            <div id="sidebar">
                <div id="input"></div>
                <div id="controls">
                    <div class="control">
                        <input type="checkbox" id="show-node-type" onchange="render()" checked/>
                        <label for="show-node-type">Node Type</label>
                    </div>
                    <div class="control">
                        <input type="checkbox" id="show-edge-type" onchange="render()" checked/>
                        <label for="show-edge-type">Edge Type</label>
                    </div>
                    <div class="control">
                        <input type="checkbox" id="show-node-weights" onchange="render()" checked/>
                        <label for="show-node-weights">Node Weights</label>
                    </div>
                    <div class="control">
                        <input type="checkbox" id="show-edge-weights" onchange="render()" checked/>
                        <label for="show-edge-weights">Edge Weights</label>
                    </div>
                    <div class="control">
                        <input type="checkbox" id="show-node-wildcards" onchange="render()" checked/>
                        <label for="show-node-wildcards">Node Wildcards</label>
                    </div>
                    <div class="control">
                        <input type="checkbox" id="show-edge-wildcards" onchange="render()" checked/>
                        <label for="show-edge-wildcards">Edge Wildcards</label>
                    </div>
                </div>
                <button onclick="render()">Render</button>
            </div>
            <div id="resizer"></div>
            <div id="main">
                <button id="toggle-sidebar" onclick="toggleSidebar()" aria-label="Toggle sidebar" title="Toggle sidebar">☰</button>
                <div id="error"></div>
                <div id="viz"></div>
            </div>
        </div>
    </body>

    <script>
        const MODEL_STORAGE_KEY = "fga-model-dsl";
        const SETTINGS_STORAGE_KEY = "fga-display-settings";
        const SETTING_IDS = [
            "show-node-type",
            "show-edge-type",
            "show-node-weights",
            "show-edge-weights",
            "show-node-wildcards",
            "show-edge-wildcards"
        ];

        const saveModel = () => {
            try {
                localStorage.setItem(MODEL_STORAGE_KEY, editor.getValue());
            } catch (e) { /* storage unavailable */ }
        };

        const saveSettings = () => {
            const settings = {};
            for (const id of SETTING_IDS) {
                settings[id] = document.getElementById(id).checked;
            }
            try {
                localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(settings));
            } catch (e) { /* storage unavailable */ }
        };

        const restoreSettings = () => {
            let settings;
            try {
                settings = JSON.parse(localStorage.getItem(SETTINGS_STORAGE_KEY));
            } catch (e) { return; }
            if (!settings) return;
            for (const id of SETTING_IDS) {
                if (typeof settings[id] === "boolean") {
                    document.getElementById(id).checked = settings[id];
                }
            }
        };

        const render = async()=>{
            saveModel();
            saveSettings();
            const authorizationModelDSL = editor.getValue();
            const resp = await fetch('/transform', {
                method: "POST",
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ authorizationModelDSL })
            });

            if (resp.status == 500) {
                document.getElementById("error").innerHTML = await resp.text();
                return
            }
            document.getElementById("error").innerHTML = "";

            const weightedGraph = await resp.json();

            const options = {
                showNodeType: document.getElementById("show-node-type").checked,
                showEdgeType: document.getElementById("show-edge-type").checked,
                showNodeWeights: document.getElementById("show-node-weights").checked,
                showEdgeWeights: document.getElementById("show-edge-weights").checked,
                showNodeWildcards: document.getElementById("show-node-wildcards").checked,
                showEdgeWildcards: document.getElementById("show-edge-wildcards").checked
            };
            Viz.instance().then(viz => {
                const svg = viz.renderSVGElement(convertToVizFormat(weightedGraph,options));
                document.getElementById("viz").innerHTML = "";
                document.getElementById("viz").appendChild(svg);
            });
        }

        const convertToVizFormat = (input,options) => {
            const graph = input.weightedGraph;
            const edges = [];

            const nodes = {}

            for (const edgeGroup of Object.values(graph.Edges)) {
                for (const edge of edgeGroup) {
                const tail = edge.From?.UniqueLabel;
            
                if (!nodes[tail]) {
                    const nodeWeightText = (()=>{
                        if (!edge.From.Weights || !options.showNodeWeights){
                            return ""
                        }
                        return Object.keys(edge.From.Weights).map(
                            key=>"<b>"+key+"</b>: "+edge.From.Weights[key]
                        ).join(", ").replaceAll("2147483647","∞")
                    })()

                    const label = edge.From.NodeType == "OperatorNode" ? edge.From.Label : edge.From.UniqueLabel;
                    const color = edge.From.NodeType == "OperatorNode" ? "#d4d4d4" : "#000"
                    const shape = edge.From.NodeType == "OperatorNode" ? "rectangle" : "oval"
                    const nodeTypeText = (options.showNodeType ? edge.From.NodeType : "")

                    const nodeWildcardText = (()=>{
                        if (!options.showNodeWildcards || !edge.From.Wildcards || edge.From.Wildcards.length == 0){
                            return ""
                        }
                        return "<br/><b>Wildcards: </b>" + edge.From.Wildcards.join(", ")
                    })()

                    nodes[tail] = { 
                        name: tail, 
                        attributes: {
                            shape,
                            color,
                            label: {html:"<b>"+label+"</b>"+"<br/>"+nodeTypeText+"<br/>"+ nodeWeightText+ nodeWildcardText}
                        }
                    }
                }

                const head = edge.To?.UniqueLabel;
                if (!nodes[head]) {
                    const nodeWeightText = (()=>{
                        if (!edge.To.Weights || !options.showNodeWeights){
                            return ""
                        }
                        return Object.keys(edge.To.Weights).map(
                            key=>"<b>"+key+"</b>: "+edge.To.Weights[key]
                        ).join(", ").replaceAll("2147483647","∞")
                    })()
                    const nodeWildcardText = (()=>{
                        if (!options.showNodeWildcards || !edge.To.Wildcards || edge.To.Wildcards.length == 0){
                            return ""
                        }
                        return "<br/><b>Wildcards: </b>" + edge.To.Wildcards.join(", ")
                    })()

                    const label = edge.To.NodeType == "OperatorNode" ? edge.To.Label : edge.To.UniqueLabel;
                    const color = edge.To.NodeType == "OperatorNode" ? "#d4d4d4" : "#000"
                    const shape = edge.To.NodeType == "OperatorNode" ? "rectangle" : "oval"
                    const nodeTypeText = (options.showNodeType ? edge.To.NodeType : "")

                    nodes[head] = {
                        name: head,
                        attributes:{
                            shape,
                            color,
                            label: {html:"<b>"+label+"</b>"+"<br/>"+nodeTypeText+"<br/>"+ nodeWeightText + nodeWildcardText}
                        }
                    }
                }

                const edgeWeightText = (()=>{
                    if (!options.showEdgeWeights){
                        return ""
                    }
                    return  Object.keys(edge.Weights).map(
                        key=>"<b>"+key+"</b>: "+edge.Weights[key]
                    ).join(", ").replaceAll("2147483647","∞") + "<br/>"
                })()
                
                const edgeTypeText = options.showEdgeType ? edge.EdgeType : ""

                const wildcardText = (()=>{
                    if (!options.showEdgeWildcards || !edge.Wildcards || edge.Wildcards.length == 0){
                        return ""
                    }
                    return "<b>Wildcards: </b>" + edge.Wildcards.join(", ")
                })()

                if (tail && head) {
                    edges.push({ tail, head, attributes: {label: {html:edgeWeightText+edgeTypeText+"<br/>"+ wildcardText}}});
                }
                }
            }

            return {
                directed: true,
                nodes:Object.keys(nodes).map(key=>nodes[key]),
                edges,
            };
        }

        const editor = ace.edit("input");
        editor.setOptions({ 
            useSoftTabs: true, 
            tabSize: 3,
            displayIndentGuides: true,
            enableAutoIndent: true
        });
        editor.commands.addCommand({
            name: "submitOnCtrlEnter",
            bindKey: { win: "Ctrl-Enter", mac: "Command-Enter" },
            exec: render
        });
        const DEFAULT_MODEL = `model
  schema 1.1

type user
type employee

type group
   relations
      define member: [user] or member from parent
      define parent: [group]

type folder
   relations
      define viewer: [user]
      define owner: [employee]

type document
  relations
      define viewer: [user, group#member] or viewer from parent
      define parent: [folder]`;

        let savedModel = null;
        try {
            savedModel = localStorage.getItem(MODEL_STORAGE_KEY);
        } catch (e) { /* storage unavailable */ }
        editor.setValue(savedModel !== null ? savedModel : DEFAULT_MODEL, -1);

        restoreSettings();

        editor.session.on("change", saveModel);
    new ResizeObserver(() => {
        editor.resize();
    }).observe(document.getElementById("input"));

        // --- Sidebar resize & collapse ---
        const SIDEBAR_WIDTH_KEY = "fga-sidebar-width";
        const SIDEBAR_COLLAPSED_KEY = "fga-sidebar-collapsed";
        const MIN_SIDEBAR_WIDTH = 200;
        const DEFAULT_SIDEBAR_WIDTH = 420;

        const sidebar = document.getElementById("sidebar");
        const resizer = document.getElementById("resizer");

        const setSidebarWidth = (width) => {
            const clamped = Math.max(MIN_SIDEBAR_WIDTH, width);
            sidebar.style.width = clamped + "px";
            try { localStorage.setItem(SIDEBAR_WIDTH_KEY, clamped); } catch (e) {}
        };

        function toggleSidebar() {
            const collapsed = sidebar.classList.toggle("collapsed");
            try { localStorage.setItem(SIDEBAR_COLLAPSED_KEY, collapsed ? "1" : "0"); } catch (e) {}
        }

        // Restore persisted sidebar state
        try {
            const savedWidth = parseInt(localStorage.getItem(SIDEBAR_WIDTH_KEY), 10);
            if (!isNaN(savedWidth)) {
                sidebar.style.width = Math.max(MIN_SIDEBAR_WIDTH, savedWidth) + "px";
            }
            if (localStorage.getItem(SIDEBAR_COLLAPSED_KEY) === "1") {
                sidebar.classList.add("collapsed");
            }
        } catch (e) { /* storage unavailable */ }

        // Drag-to-resize
        let dragging = false;
        resizer.addEventListener("mousedown", (e) => {
            dragging = true;
            e.preventDefault();
            document.body.style.cursor = "col-resize";
            document.body.style.userSelect = "none";
        });
        document.addEventListener("mousemove", (e) => {
            if (!dragging) return;
            setSidebarWidth(e.clientX - sidebar.getBoundingClientRect().left);
        });
        document.addEventListener("mouseup", () => {
            if (!dragging) return;
            dragging = false;
            document.body.style.cursor = "";
            document.body.style.userSelect = "";
        });
    </script>
</html>
